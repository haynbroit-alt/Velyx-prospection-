# CI publique de VELYX : tests et antifuite structurelle (sans dictionnaire, la CI ne voit que les fichiers publics).
# Aucun secret, aucun réseau métier : le cycle n'y tourne jamais.
name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: node bin/velyx.js garde --structurel
